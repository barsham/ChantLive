name: Bug report
description: Report a reproducible ChantLive problem.
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: The participant view stopped updating after...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the issue.
      placeholder: |
        1. Create a demonstration
        2. Add two chants
        3. Start auto-rotation
        4. Open the participant link
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, deployment, and app version if known.
      placeholder: Chrome on Android, chantlive.online, v1.1.10
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant non-sensitive logs or attach screenshots.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not included passwords, tokens, API keys, private links, or private participant data.
          required: true
