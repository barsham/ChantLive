name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: verify
    environment: production

    steps:
      - name: Prepare SSH key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || '178.105.99.151' }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HETZNER_SSH_PRIVATE_KEY" ]; then
            echo "Missing required repository secret: HETZNER_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy current main branch
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || '178.105.99.151' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || 'root' }}
          APP_DIR: ${{ vars.HETZNER_APP_DIR || '/opt/chantlive' }}
          SERVICE_NAME: ${{ vars.HETZNER_SERVICE_NAME || 'chantlive' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/hetzner_deploy "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "$APP_DIR"
          git fetch --prune origin main
          git reset --hard origin/main
          bash script/deploy-production.sh
          REMOTE

      - name: Certify public service readiness
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://chantlive.online' }}
        run: |
          for attempt in 1 2 3; do
            curl --fail --silent --show-error \
              --max-time 15 \
              --retry 2 \
              --retry-all-errors \
              "$PUBLIC_URL/readyz"
            sleep 10
          done

      - name: Collect production diagnostics on failure
        if: failure()
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || '178.105.99.151' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || 'root' }}
          SERVICE_NAME: ${{ vars.HETZNER_SERVICE_NAME || 'chantlive' }}
        run: |
          if [ ! -f ~/.ssh/hetzner_deploy ]; then
            exit 0
          fi
          ssh -i ~/.ssh/hetzner_deploy "$HETZNER_USER@$HETZNER_HOST" \
            "systemctl status '$SERVICE_NAME' --no-pager -n 20 || true; \
             systemctl status postgresql --no-pager -n 20 || true; \
             pg_lsclusters || true; \
             systemctl list-units 'postgresql@*' --all --no-pager || true; \
             journalctl -u '$SERVICE_NAME' --no-pager -n 60 || true; \
             journalctl -u postgresql --no-pager -n 40 || true; \
             tail -n 80 /var/log/postgresql/postgresql-*.log || true; \
             id postgres || true; \
             stat -c '%U:%G %a %n' /etc/ssl/private/ssl-cert-snakeoil.key || true; \
             stat -c '%U:%G %a %n' /etc/ssl/private || true; \
             runuser -u postgres -- test -r /etc/ssl/private/ssl-cert-snakeoil.key || true; \
             df -h / /var/lib/postgresql || true"
