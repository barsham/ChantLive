name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: verify
    environment: production

    steps:
      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy current main branch
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          APP_DIR: ${{ vars.HETZNER_APP_DIR || '/opt/chantlive' }}
          SERVICE_NAME: ${{ vars.HETZNER_SERVICE_NAME || 'chantlive' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/hetzner_deploy "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "$APP_DIR"
          git fetch --prune origin main
          git reset --hard origin/main
          bash script/deploy-production.sh
          REMOTE
